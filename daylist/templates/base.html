<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Daylist{% endblock %}</title>
  <script>
    document.documentElement.dataset.accent = "default";
    try {
      const saved = localStorage.getItem("daylist-theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      const accent = localStorage.getItem("daylist-accent");
      if (["default", "clay", "sage", "ocean", "lavender", "rose", "amber"].includes(accent)) document.documentElement.dataset.accent = accent;
    } catch {}
  </script>
  <style>{% include "theme.css" %}</style>
</head>
<body>{% include "icons.html" %}
  {% block header %}<header class="topbar">
    <div class="top-inner">
      <a href="/" class="brand"><span class="brand-mark" aria-hidden="true">✓</span>Daylist</a>
      <div class="header-actions">
        {% include "appearance.html" %}
        {% if request.user.is_authenticated %}
          <form method="post" action="{% url 'sign-out' %}">{% csrf_token %}<button class="quiet">Sign out</button></form>
        {% endif %}
      </div>
    </div>
  </header>{% endblock %}
  {% block content %}{% endblock %}
  <script>
    const root = document.documentElement;
    const systemTheme = matchMedia("(prefers-color-scheme: dark)");
    function isDark() { return root.dataset.theme ? root.dataset.theme === "dark" : systemTheme.matches; }
    function updateToggle() {
      const icon = document.getElementById("theme-icon");
      if (icon) icon.textContent = isDark() ? "☀" : "☾";
      for (const button of document.querySelectorAll("[data-theme-mode]")) {
        button.setAttribute("aria-pressed", String(button.dataset.themeMode === (root.dataset.theme || "system")));
      }
      for (const button of document.querySelectorAll(".accent-option")) {
        button.setAttribute("aria-pressed", String(button.dataset.accent === (root.dataset.accent || "default")));
      }
    }
    document.addEventListener("click", event => {
      const mode = event.target.closest("[data-theme-mode]");
      const accent = event.target.closest(".accent-option");
      if (mode) {
        if (mode.dataset.themeMode === "system") delete root.dataset.theme;
        else root.dataset.theme = mode.dataset.themeMode;
        try {
          if (root.dataset.theme) localStorage.setItem("daylist-theme", root.dataset.theme);
          else localStorage.removeItem("daylist-theme");
        } catch {}
      }
      if (accent) {
        root.dataset.accent = accent.dataset.accent;
        try { localStorage.setItem("daylist-accent", root.dataset.accent); } catch {}
      }
      if (mode || accent) updateToggle();
    });
    systemTheme.addEventListener("change", updateToggle);
    updateToggle();
    document.addEventListener("click", event => {
      const path = event.composedPath();
      for (const popup of document.querySelectorAll("details[data-dismiss-outside][open]")) {
        if (!path.includes(popup)) popup.open = false;
      }
    });
    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      const popup = event.target.closest("details[data-dismiss-outside][open]");
      if (popup) {
        popup.open = false;
        popup.querySelector("summary").focus();
      }
    });
    function initWorkspace() {
      updateToggle();
      const notes = document.querySelector(".task-notes textarea");
      if (notes) {
        const save = notes.form.querySelector(".notes-save");
        const updateSave = () => {
          save.hidden = notes.value === notes.defaultValue && !notes.form.querySelector(".errorlist");
        };
        notes.addEventListener("input", updateSave);
        updateSave();
      }
    }
    document.addEventListener("daylist:ready", initWorkspace);
    initWorkspace();
    document.addEventListener("submit", event => {
      const message = event.target.dataset.confirm;
      if (message && !confirm(message)) event.preventDefault();
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
