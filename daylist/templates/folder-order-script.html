<script>
(() => {
  let drag;
  let frame;
  let suppressUntil = 0;
  const busy = () => !!document.querySelector('.workspace form[aria-busy="true"]');
  const order = container => [...container.querySelectorAll(".folder-task-list > .task")].map(card => card.dataset.taskId);
  function preview(card) {
    const rect = card.getBoundingClientRect(), ghost = card.cloneNode(true);
    ghost.removeAttribute("draggable"); ghost.classList.add("matrix-drag-ghost");
    ghost.inert = true; ghost.setAttribute("aria-hidden", "true");
    Object.assign(ghost.style, { width: rect.width + "px", height: rect.height + "px", left: rect.left + "px", top: rect.top + "px" });
    for (const node of ghost.querySelectorAll("[id]")) node.removeAttribute("id");
    for (const menu of ghost.querySelectorAll("details")) menu.open = false;
    document.body.append(ghost);
    return ghost;
  }
  function restore(container, ids) {
    const cards = new Map([...container.querySelectorAll(".task")].map(card => [card.dataset.taskId, card]));
    for (const id of ids) {
      const card = cards.get(id);
      if (card) card.parentElement.append(card);
    }
  }
  function highlight(zone) {
    for (const group of document.querySelectorAll(".folder-date-group")) group.classList.toggle("is-drop-target", group === zone);
  }
  function cleanup(rollback = false) {
    if (drag) {
      if (rollback) restore(drag.container, drag.original);
      drag.card.classList.remove("is-dragging"); drag.ghost?.remove();
      if (drag.handle?.hasPointerCapture(drag.id)) drag.handle.releasePointerCapture(drag.id);
    }
    clearTimeout(drag?.hold);
    drag = null; cancelAnimationFrame(frame); highlight(null);
  }
  function save(container, original, moved) {
    const ids = order(container);
    if (ids.join(",") === original.join(",")) return;
    const form = container.querySelector(".folder-order-form");
    if (!form || busy()) { restore(container, original); return; }
    for (const input of form.querySelectorAll('[name="order"]')) input.remove();
    for (const id of ids) {
      const input = document.createElement("input");
      input.type = "hidden"; input.name = "order"; input.value = id; form.append(input);
    }
    form.dataset.movedTask = moved;
    form.addEventListener("daylist:save-failed", () => restore(container, original), { once: true });
    form.requestSubmit();
  }
  function unschedule(card) {
    if (busy() || !card.isConnected) return;
    const form = card.querySelector(".date-picker");
    form.dataset.dateDrop = "no-date";
    form.requestSubmit(form.querySelector('[name="schedule"][value="no-date"]'));
  }
  function dropZone(target) {
    const zone = target?.closest(".folder-date-group");
    if (!drag || !zone || !drag.container.contains(zone)) return null;
    if (zone === drag.group) return zone;
    return zone.dataset.group === "No date" && drag.card.querySelector('input[name="due"]').value ? zone : null;
  }
  function hover(target, y) {
    const zone = dropZone(target);
    highlight(zone);
    if (!zone) return;
    zone.open = true;
    const card = target.closest(".folder-task-list > .task");
    if (zone !== drag.group || !card || card === drag.card) return;
    const rect = card.getBoundingClientRect();
    card[y < rect.y + rect.height / 2 ? "before" : "after"](drag.card);
  }
  function finish(zone) {
    const { card, container, original, group } = drag;
    const clearDate = zone && zone !== group && zone.dataset.group === "No date";
    cleanup(!zone || clearDate);
    suppressUntil = Date.now() + 400;
    if (clearDate) unschedule(card);
    else if (zone) save(container, original, card.dataset.taskId);
  }
  function start(card, extra = {}) {
    const container = card.closest(".folder-order-container");
    drag = { card, container, group: card.closest(".folder-date-group"), original: order(container), ...extra };
  }
  document.addEventListener("dragstart", event => {
    const card = event.target.closest(".folder-task-list .task[draggable=true]");
    if (!card) return;
    if (busy() || event.target.closest("form, .schedule-menu, input, select, textarea") || drag?.id) { event.preventDefault(); return; }
    start(card); window.getSelection()?.removeAllRanges();
    event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/plain", card.dataset.taskId);
    const rect = card.getBoundingClientRect(), ghost = preview(card);
    drag.ghost = ghost;
    event.dataTransfer.setDragImage(ghost, Math.max(0, event.clientX - rect.x), Math.max(0, event.clientY - rect.y));
    requestAnimationFrame(() => { ghost.remove(); if (drag?.card === card) card.classList.add("is-dragging"); });
  });
  document.addEventListener("dragover", event => {
    if (!drag || drag.id) return;
    hover(event.target, event.clientY);
    if (dropZone(event.target)) { event.preventDefault(); event.dataTransfer.dropEffect = "move"; }
  });
  document.addEventListener("drop", event => {
    if (!drag || drag.id) return;
    event.preventDefault(); finish(dropZone(event.target));
  });
  document.addEventListener("dragend", () => cleanup(true));
  document.addEventListener("keydown", event => {
    const handle = event.target;
    if (!handle.matches('.folder-task-list > .task[draggable="true"]') || !["ArrowUp", "ArrowDown"].includes(event.key)) return;
    event.preventDefault(); if (busy()) return;
    const card = handle.closest(".task"), container = card.closest(".folder-order-container"), original = order(container);
    if (event.key === "ArrowUp") card.previousElementSibling?.before(card);
    else card.nextElementSibling?.after(card);
    save(container, original, card.dataset.taskId);
  });
  function follow() {
    if (!drag?.active) return;
    const speed = drag.y < 70 ? -12 : drag.y > innerHeight - 70 ? 12 : 0;
    if (speed) window.scrollBy(0, speed);
    hover(document.elementFromPoint(drag.x, drag.y), drag.y);
    frame = requestAnimationFrame(follow);
  }
  document.addEventListener("touchstart", event => {
    const card = event.target.closest('.folder-task-list > .task[draggable="true"]');
    if (!card || event.touches.length !== 1 || busy() || event.target.closest("form, button, input, textarea, select, .schedule-menu")) return;
    const touch = event.touches[0];
    start(card, { id: "touch", touch: true, startX: touch.clientX, startY: touch.clientY, x: touch.clientX, y: touch.clientY });
    drag.hold = setTimeout(() => {
      if (!drag?.touch) return;
      drag.active = true; window.getSelection()?.removeAllRanges();
      drag.ghost = preview(drag.card); drag.ghost.style.left = "0"; drag.ghost.style.top = "0";
      drag.ghost.style.transform = `translate(${drag.x - 25}px, ${drag.y - 25}px)`;
      drag.card.classList.add("is-dragging"); follow();
    }, 320);
  }, { passive: true });
  document.addEventListener("touchmove", event => {
    if (!drag?.touch) return;
    if (event.touches.length !== 1) { cleanup(true); return; }
    const touch = event.touches[0]; drag.x = touch.clientX; drag.y = touch.clientY;
    if (!drag.active) {
      if (Math.hypot(drag.x - drag.startX, drag.y - drag.startY) > 8) cleanup(true);
      return;
    }
    event.preventDefault();
    drag.ghost.style.transform = `translate(${drag.x - 25}px, ${drag.y - 25}px)`;
  }, { passive: false });
  document.addEventListener("touchend", event => {
    if (!drag?.touch) return;
    if (drag.active) { event.preventDefault(); finish(dropZone(document.elementFromPoint(drag.x, drag.y))); }
    else cleanup();
  }, { passive: false });
  document.addEventListener("touchcancel", () => { if (drag?.touch) cleanup(true); });
  document.addEventListener("contextmenu", event => { if (drag?.touch) event.preventDefault(); });
  document.addEventListener("click", event => {
    if (Date.now() < suppressUntil && event.target.closest(".folder-order-container")) { event.preventDefault(); event.stopPropagation(); }
  }, true);
  document.addEventListener("daylist:ready", () => cleanup());
})();
</script>
