<fieldset class="template-task" {% if item.DELETE.value %}hidden{% endif %}>
  <legend>Task</legend>
  {{ item.non_field_errors }}
  <div class="template-task-title"><label class="sr-only" for="{{ item.title.id_for_label }}">Task name</label>{{ item.title }}<span hidden>{{ item.DELETE }}</span><button type="button" class="icon-button trash-button" data-remove-template-task aria-label="Remove preset task" title="Remove task"><svg><use href="#icon-trash"/></svg></button></div>
  {{ item.title.errors }}
  <details class="template-task-details" {% if item.errors %}open{% endif %}><summary>Notes, subtasks, and priority</summary>
    <label for="{{ item.notes.id_for_label }}">Notes</label>{{ item.notes }}{{ item.notes.errors }}
    <label for="{{ item.subtasks.id_for_label }}">Subtasks (one per line)</label>{{ item.subtasks }}{{ item.subtasks.errors }}
    <label class="priority-label">{{ item.flagged }} Priority</label>
  </details>
</fieldset>
