<script>
(() => {
  function init() {
    for (const form of document.querySelectorAll(".inline-title-editor")) {
      const button = form.querySelector(".inline-title-display");
      const input = form.querySelector(".inline-title-input");
      let saving = false;
      function edit() {
        form.classList.add("is-editing");
        button.hidden = true;
        input.hidden = false;
        input.focus();
        input.select();
      }
      function cancel() {
        input.value = input.dataset.original;
        input.hidden = true;
        button.hidden = false;
        form.querySelector(".inline-title-errors").replaceChildren();
        input.removeAttribute("aria-invalid");
        form.classList.remove("is-editing");
      }
      button.addEventListener("click", edit);
      input.addEventListener("keydown", event => {
        if (event.isComposing) return;
        if (event.key === "Escape") {
          event.preventDefault();
          cancel();
          button.focus();
        } else if (event.key === "Enter") {
          event.preventDefault();
          form.requestSubmit();
        }
      });
      input.addEventListener("blur", () => {
        if (input.hidden || saving) return;
        if (input.value.trim() === input.dataset.original) cancel();
        else if (input.checkValidity()) form.requestSubmit();
      });
      form.addEventListener("submit", event => {
        if (input.value.trim() === input.dataset.original) {
          event.preventDefault();
          cancel();
        }
      });
      form.addEventListener("daylist:saving", () => { saving = true; });
      form.addEventListener("daylist:save-failed", () => { saving = false; });
      if (form.classList.contains("is-editing")) edit();
      else { input.hidden = true; button.hidden = false; }
    }
  }
  document.addEventListener("daylist:ready", init);
  init();
})();
</script>
