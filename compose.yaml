services:
  app:
    container_name: daylist
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      APP_HOSTS: "${APP_HOSTS:-*}"
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Singapore}
    ports:
      - "8000:8000"
    volumes:
      - task_data:/data

volumes:
  task_data:
