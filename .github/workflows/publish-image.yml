name: Publish Daylist

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v1.0.0
        type: string
        required: true
      promote_only:
        description: Point latest at an existing release without rebuilding it
        type: boolean
        default: false

concurrency:
  group: daylist-release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}

      - name: Validate release notes
        if: ${{ !inputs.promote_only }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/releases/$RELEASE_TAG.md"
          test -s "$notes" || { echo "Missing release notes: $notes"; exit 1; }
          title=$(head -n 1 "$notes")
          [[ "$title" == "# Daylist $RELEASE_TAG" ]] || { echo "Release notes need a versioned title."; exit 1; }

      - name: Set up ARM emulation
        if: ${{ !inputs.promote_only }}
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish the container image
        if: ${{ !inputs.promote_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.licenses=MIT" .
          echo "DAYLIST_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Test the image-based install
        if: ${{ !inputs.promote_only }}
        run: |
          install_dir="$RUNNER_TEMP/daylist-install"
          mkdir -p "$install_dir"
          sed "s|^    build: \.$|    image: $DAYLIST_IMAGE|" compose.yaml > "$install_dir/compose.yaml"
          grep -Fx "    image: $DAYLIST_IMAGE" "$install_dir/compose.yaml"
          cd "$install_dir"
          export DJANGO_SECRET_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$DJANGO_SECRET_KEY"
          trap 'docker compose down -v' EXIT
          for attempt in {1..10}; do
            if docker compose pull; then break; fi
            if [ "$attempt" -eq 10 ]; then exit 1; fi
            sleep 3
          done
          docker compose up -d --wait
          curl --fail --silent --show-error --retry 15 --retry-all-errors --max-time 5 \
            --retry-delay 2 http://127.0.0.1:8000/sign-in/ > /dev/null
          docker compose exec -T app python manage.py migrate --check

      - name: Publish the GitHub Release
        if: ${{ !inputs.promote_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          title=$(head -n 1 "$notes")
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/daylist-install/compose.yaml" \
            --verify-tag --title "${title#\# }" --notes-file "$notes"

      - name: Update latest image tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          newest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$newest" != "$RELEASE_TAG" ]; then
            echo "Leaving latest on $newest; $RELEASE_TAG is not the latest published release."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$image:latest" "$image:${RELEASE_TAG#v}"
          source_digest=$(docker buildx imagetools inspect "$image:${RELEASE_TAG#v}" --format '{{json .Manifest.Digest}}')
          latest_digest=$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest.Digest}}')
          test "$source_digest" = "$latest_digest"
