name: Publish Daylist

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v1.0.0
        type: string
        required: true

concurrency:
  group: daylist-release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish the container image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.licenses=MIT" .
          echo "DAYLIST_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Test the image-based install
        run: |
          install_dir="$RUNNER_TEMP/daylist-install"
          mkdir -p "$install_dir"
          sed "s|^    build: \.$|    image: $DAYLIST_IMAGE|" compose.yaml > "$install_dir/compose.yaml"
          grep -Fx "    image: $DAYLIST_IMAGE" "$install_dir/compose.yaml"
          cd "$install_dir"
          export DJANGO_SECRET_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$DJANGO_SECRET_KEY"
          export LOCAL_HTTP=1
          trap 'docker compose down -v' EXIT
          docker compose up -d --wait
          curl --fail --silent --show-error --retry 15 --retry-connrefused \
            --retry-delay 2 http://127.0.0.1:8000/sign-in/ > /dev/null
          docker compose exec -T app python manage.py migrate --check

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/daylist-install/compose.yaml" \
            --verify-tag --title "Daylist $RELEASE_TAG" \
            --notes "Install with the attached compose.yaml. See the README for the secret and account setup."
